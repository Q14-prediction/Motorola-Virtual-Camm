name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Fix Directory Structure
      run: |
        mkdir -p app/src/main/java app/src/main/res/values gradle
        [ -f "libs.versions.toml" ] && mv libs.versions.toml gradle/ || true
        [ -f "build.gradle.kts" ] && mv build.gradle.kts app/ || true
        [ -f "build (1).kts" ] && mv "build (1).kts" app/build.gradle.kts || true
        [ -f "AndroidManifest.xml" ] && mv AndroidManifest.xml app/src/main/ || true
        mv *.kt app/src/main/java/ || true
        for f in strings.xml styles.xml themes.xml colors.xml *.xml; do
          [ -f "$f" ] && mv "$f" app/src/main/res/values/ || true
        done

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug || gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
