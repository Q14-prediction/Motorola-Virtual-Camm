name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Final Fix and Setup Project Configuration
      run: |
        mkdir -p app/src/main/java app/src/main/res/values
        
        # Rangement des fichiers
        [ -f "build.gradle.kts" ] && mv build.gradle.kts app/ || true
        [ -f "build (1).kts" ] && mv "build (1).kts" app/build.gradle.kts || true
        [ -f "AndroidManifest.xml" ] && mv AndroidManifest.xml app/src/main/ || true
        mv *.kt app/src/main/java/ 2>/dev/null || true
        
        for f in strings.xml styles.xml themes.xml colors.xml *.xml; do
          [ -f "$f" ] && mv "$f" app/src/main/res/values/ || true
        done

        # 1. Création d'un settings.gradle.kts configuré avec les dépôts de plugins
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "Motorola-Virtual-Cam"
        include(":app")
        EOF

        # 2. Réécriture propre du build.gradle.kts de l'application avec les versions explicites
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.0"
            id("org.jetbrains.kotlin.android") version "1.9.23"
        }

        android {
            namespace = "com.studio.motorolavirtualcamera"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.studio.motorolavirtualcamera"
                minSdk = 26
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
                testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
            }

            buildTypes {
                release {
                    isMinifyEnabled = false
                }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("com.google.android.material:material:1.11.0")
        }
        EOF

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug || gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
